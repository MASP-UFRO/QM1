<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pozo finito - Condiciones de energía (caso b)</title>
	<script src="https://masp-ufro.github.io/QM1/HTMLSimTools.js?v=5"></script>
	<style>
		/* Estilos propios de este gráfico */
		.legend {
			display: flex;
			flex-direction: column;
			gap: 5px;
			margin-top: 12px;
			font-size: 1.05em;
		}

		.legend-item {
			display: flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
			font-weight: 400;
			color: #333;
			user-select: none;
		}

		.legend-item input {
			accent-color: var(--colorBACK);
			width: 15px;
			height: 15px;
			flex: none;
		}

		.swatch {
			display: inline-block;
			width: 26px;
			height: 5px;
			border-radius: 3px;
			flex: none;
		}

		.dot {
			display: inline-block;
			width: 11px;
			height: 11px;
			border-radius: 50%;
			background: #222;
			margin: 0 7px;
			flex: none;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="main-content">
			<div class="sim-layout">

				<aside class="sidebar">
					<div class="controls-container">
						<div class="controls-grid">
							<div class="control-group">
								<h3>Ancho del pozo</h3>
								<div class="input-row">
									<label for="L1">L (&Aring;):</label>
									<input type="number" id="L1" value="16.5" min="3" max="30" step="0.1">
								</div>
								<input type="range" id="L1r" min="3" max="30" step="0.1" value="16.5" aria-label="L">
								<div class="range-limits"><span>3 &Aring;</span><span>30 &Aring;</span></div>
							</div>
							<div class="control-group">
								<h3>Profundidad del pozo</h3>
								<div class="input-row">
									<label for="dV1">&Delta;V (eV):</label>
									<input type="number" id="dV1" value="11.5" min="3" max="20" step="0.1">
								</div>
								<input type="range" id="dV1r" min="3" max="20" step="0.1" value="11.5" aria-label="DeltaV">
								<div class="range-limits"><span>3 eV</span><span>20 eV</span></div>
							</div>
						</div>
						<button class="btn-secondary" id="reset1" type="button">&#8635; Restablecer</button>

						<div class="legend" id="legend1">
							<label class="legend-item"><input type="checkbox" data-k="par" checked><span class="swatch" style="background:repeating-linear-gradient(90deg,#8778B3 0 8px,transparent 8px 12px)"></span><span>det(<b>M</b><sub>par</sub>) = 0</span></label>
							<label class="legend-item"><input type="checkbox" data-k="impar" checked><span class="swatch" style="background:repeating-linear-gradient(90deg,#C56E1A 0 9px,transparent 9px 12px,#C56E1A 12px 15px,transparent 15px 18px)"></span><span>det(<b>M</b><sub>impar</sub>) = 0</span></label>
							<label class="legend-item"><input type="checkbox" data-k="line" checked><span class="swatch" style="background:#8FB032"></span><span>&Lambda;(&eta;; L, &Delta;V)</span></label>
							<label class="legend-item"><input type="checkbox" data-k="pts" checked><span class="dot"></span><span>Energías permitidas</span></label>
						</div>
					</div>
				</aside>

				<div class="plot-column">
					<div class="canvas-container">
						<canvas id="plot1" width="1000" height="560"></canvas>
					</div>
					<div class="info-panel">
						<div class="info-grid">
							<div class="info-box"><h4>Estados ligados</h4><div class="info-value" id="i1_nb">0</div></div>
							<div class="info-box"><h4>c = (L/2)&radic;(2m&Delta;V)/&hbar;</h4><div class="info-value" id="i1_c">0.00</div></div>
							<div class="info-box"><h4>L / (&lambda;<sub>&Delta;V</sub> / 2)</h4><div class="info-value" id="i1_ratio">0.00</div></div>
						</div>
					</div>
					<div class="info-panel">
						<div class="info-grid" id="energies"></div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<script>
	(function () {
		'use strict';

		var T = HTMLSim;
		var ensureSize = T.ensureSize, drawText = T.drawText, niceStep = T.niceStep, fmtTick = T.fmtTick, kOf = T.kOf, bindPair = T.bindPair, getNum = T.getNum, setPair = T.setPair, boundStates = T.boundStates;

		/* ============================================================
		   Simulación 1: condiciones de energía en el plano (η, Λ)
		   Curvas det(M_par) = 0 y det(M_impar) = 0, y la curva Λ(η; L, ΔV)
		   ============================================================ */
		var P = {
			cv: document.getElementById('plot1'),
			L: document.getElementById('L1'), LR: document.getElementById('L1r'),
			dV: document.getElementById('dV1'), dVR: document.getElementById('dV1r'),
			show: { par: true, impar: true, line: true, pts: true },
			Lmax: 30, dVmax: 20
		};
		var S = { ctx: null, w: 0, h: 0 };
		ensureSize(S, P.cv, 0.6, 380, 620);
		// Colores de la paleta usada en Mathematica (ColorData[97])
		var C_PAR = '#8778B3', C_IMP = '#C56E1A', C_LIN = '#8FB032';
		// Λ máximo del gráfico: Λ(η = 1) para L = 30 Å y ΔV = 20 eV
		var LAMMAX = (P.Lmax / 2) * kOf(P.dVmax) / Math.PI;

		// Curvas det = 0 (en función de φ, con η = sin²φ):  par: Λ = j + 1/2 − φ/π;  impar: Λ = j − φ/π
		function detCurve(ctx, X, Y, offset, jmin) {
			var NP = 240, j, i, phi, eta, lam;
			for (j = jmin; j <= LAMMAX + 1; j++) {
				ctx.beginPath();
				for (i = 0; i <= NP; i++) {
					phi = (Math.PI / 2) * i / NP;
					eta = Math.sin(phi) * Math.sin(phi);
					lam = j + offset - phi / Math.PI;
					if (i === 0) { ctx.moveTo(X(eta), Y(lam)); } else { ctx.lineTo(X(eta), Y(lam)); }
				}
				ctx.stroke();
			}
		}

		function drawPlot() {
			var L = getNum(P.L, 16.5), dV = getNum(P.dV, 11.5);
			ensureSize(S, P.cv, 0.6, 380, 620);
			var ctx = S.ctx, W = S.w, H = S.h;
			var fs = Math.max(0.62, Math.min(1, W / 760));
			var ml = 78, mr = 28, mt = 84, mb = 66;
			var pw = W - ml - mr, ph = H - mt - mb;
			var xmin = 0, xmax = 1, ymin = 0, ymax = LAMMAX;
			function X(v) { return ml + (v - xmin) / (xmax - xmin) * pw; }
			function Y(v) { return mt + ph - (v - ymin) / (ymax - ymin) * ph; }

			var bs = boundStates(L, dV), c = bs.c;

			ctx.clearRect(0, 0, W, H);
			ctx.fillStyle = '#fff';
			ctx.fillRect(ml, mt, pw, ph);

			// rejilla y ticks
			var i, v, stepY = niceStep(ymax - ymin, 8);
			ctx.lineWidth = 1;
			for (i = 0; i <= 10; i++) {                      // η: cada 0.1
				v = i / 10;
				ctx.strokeStyle = (i % 2 === 0) ? '#d5d8e0' : '#ececf1';
				ctx.beginPath(); ctx.moveTo(X(v), mt); ctx.lineTo(X(v), mt + ph); ctx.stroke();
				if (i % 2 === 0) { drawText(ctx, v.toFixed(1), X(v), mt + ph + 22, 17, 'center', '#555'); }
			}
			ctx.strokeStyle = '#ececf1';
			for (v = 0; v <= ymax + 1e-9; v += stepY) {
				ctx.beginPath(); ctx.moveTo(ml, Y(v)); ctx.lineTo(ml + pw, Y(v)); ctx.stroke();
				drawText(ctx, fmtTick(v), ml - 10, Y(v) + 5, 17, 'right', '#555');
			}

			ctx.strokeStyle = '#333'; ctx.lineWidth = 1.6;
			ctx.strokeRect(ml, mt, pw, ph);

			ctx.save();
			ctx.beginPath(); ctx.rect(ml, mt, pw, ph); ctx.clip();
			ctx.lineJoin = 'round';

			// curvas det(M) = 0
			if (P.show.par) {
				ctx.setLineDash([9, 5]); ctx.strokeStyle = C_PAR; ctx.lineWidth = 2;
				detCurve(ctx, X, Y, 0.5, 0);
			}
			if (P.show.impar) {
				ctx.setLineDash([10, 4, 2, 4]); ctx.strokeStyle = C_IMP; ctx.lineWidth = 2;
				detCurve(ctx, X, Y, 0, 1);
			}
			ctx.setLineDash([]);

			// curva Λ(η; L, ΔV) = (c/π) √η
			if (P.show.line) {
				ctx.strokeStyle = C_LIN; ctx.lineWidth = 3.6;
				ctx.beginPath();
				for (i = 0; i <= 300; i++) {
					v = i / 300;
					if (i === 0) { ctx.moveTo(X(v), Y(c / Math.PI * Math.sqrt(v))); } else { ctx.lineTo(X(v), Y(c / Math.PI * Math.sqrt(v))); }
				}
				ctx.stroke();
			}

			// energías permitidas: intersecciones (η_n, Λ_n)
			if (P.show.pts) {
				bs.states.forEach(function (s) {
					ctx.fillStyle = '#111'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
					ctx.beginPath(); ctx.arc(X(s.eta), Y(c / Math.PI * Math.sqrt(s.eta)), 6.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
				});
			}
			ctx.restore();

			// etiquetas de ejes y título
			drawText(ctx, 'η = ΔE/ΔV', ml + pw / 2, H - 14, 22, 'center', '#333', 'bold');
			ctx.save();
			ctx.translate(20, mt + ph / 2); ctx.rotate(-Math.PI / 2);
			drawText(ctx, 'Λ = L/λ_dB', 0, 0, 22, 'center', '#333', 'bold');
			ctx.restore();
			drawText(ctx, 'Energías permitidas: intersecciones de las curvas', W / 2, 30, Math.round(22 * fs), 'center', '#333', 'bold');
			drawText(ctx, 'L = ' + (Math.round(L * 10) / 10) + ' Å,   ΔV = ' + (Math.round(dV * 10) / 10) + ' eV   →   ' + bs.nbnd + ' estados ligados',
					 W / 2, 58, Math.round(20 * fs), 'center', '#555', 'bold');

			updateInfo(bs, L, dV);
		}

		function updateInfo(bs, L, dV) {
			document.getElementById('i1_nb').textContent = bs.nbnd;
			document.getElementById('i1_c').textContent = bs.c.toFixed(3);
			document.getElementById('i1_ratio').textContent = (2 * bs.c / Math.PI).toFixed(3);
			var box = document.getElementById('energies'), html = '';
			bs.states.forEach(function (s) {
				html += '<div class="info-box"><h4>n = ' + s.n + ' (' + (s.par ? 'par' : 'impar') + ')</h4>' +
				        '<div class="info-value">' + s.dE.toFixed(3) + ' eV</div></div>';
			});
			box.innerHTML = '<div class="info-box" style="flex-basis:100%"><h4>Energías permitidas &Delta;E<sub>n</sub> = &eta;<sub>n</sub> &Delta;V, medidas desde el fondo del pozo</h4></div>' + html;
		}

		bindPair(P.L, P.LR, drawPlot);
		bindPair(P.dV, P.dVR, drawPlot);
		Array.prototype.forEach.call(document.querySelectorAll('#legend1 input[type="checkbox"]'), function (cb) {
			cb.addEventListener('change', function () { P.show[cb.getAttribute('data-k')] = cb.checked; drawPlot(); });
		});
		document.getElementById('reset1').addEventListener('click', function () {
			setPair(P.L, P.LR, 16.5);
			setPair(P.dV, P.dVR, 11.5);
			drawPlot();
		});

		/* Arranque */
		drawPlot();
		window.addEventListener('resize', drawPlot);

		T.onFontsReady(drawPlot);
	})();
	</script>
</body>
</html>
