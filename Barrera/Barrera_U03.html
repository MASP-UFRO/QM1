<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Barrera de potencial - Funciones de onda</title>
	<script src="https://masp-ufro.github.io/QM1/HTMLSimTools.js?v=5"></script>
	<style>
		/* Estilos propios de este gráfico */
		.legend {
			display: flex;
			flex-direction: column;
			gap: 5px;
			margin-top: 12px;
			font-size: 1.05em;
		}

		.legend-item {
			display: flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
			font-weight: 400;
			color: #333;
			user-select: none;
		}

		.legend-item input {
			accent-color: var(--colorBACK);
			width: 15px;
			height: 15px;
			flex: none;
		}

		.swatch {
			display: inline-block;
			width: 26px;
			height: 5px;
			border-radius: 3px;
			flex: none;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="main-content">
			<div class="sim-layout">

				<aside class="sidebar">
					<div class="controls-container">
						<div class="controls-grid">
							<div class="control-group">
								<h3>Energía</h3>
								<div class="input-row">
									<label for="eta2">&eta;:</label>
									<input type="number" id="eta2" value="1.505" min="0.01" max="3" step="0.01">
								</div>
								<input type="range" id="eta2r" min="0.01" max="3" step="0.01" value="1.505" aria-label="eta">
								<div class="range-limits"><span>0.01</span><span>3.00</span></div>
							</div>
							<div class="control-group">
								<h3>Ancho de la barrera</h3>
								<div class="input-row">
									<label for="L2">L (&Aring;):</label>
									<input type="number" id="L2" value="15.5" min="1" max="30" step="0.1">
								</div>
								<input type="range" id="L2r" min="1" max="30" step="0.1" value="15.5" aria-label="L">
								<div class="range-limits"><span>1 &Aring;</span><span>30 &Aring;</span></div>
							</div>
							<div class="control-group">
								<h3>Altura de la barrera</h3>
								<div class="input-row">
									<label for="dV2">&Delta;V (eV):</label>
									<input type="number" id="dV2" value="10.5" min="1" max="20" step="0.1">
								</div>
								<input type="range" id="dV2r" min="1" max="20" step="0.1" value="10.5" aria-label="DeltaV">
								<div class="range-limits"><span>1 eV</span><span>20 eV</span></div>
							</div>
						</div>
						<button class="btn-secondary" id="reset2" type="button">&#8635; Restablecer</button>

						<div class="legend" id="legend2">
							<label class="legend-item"><input type="checkbox" data-k="inc" checked><span class="swatch" style="background:#5E81B5"></span>Incidente desde 1</label>
							<label class="legend-item"><input type="checkbox" data-k="ref12" checked><span class="swatch" style="background:#E19C24"></span>Reflejado en frontera 1|2</label>
							<label class="legend-item"><input type="checkbox" data-k="tr12" checked><span class="swatch" style="background:#8FB032"></span>Transmitido 1&rarr;2</label>
							<label class="legend-item"><input type="checkbox" data-k="ref23" checked><span class="swatch" style="background:#EB6235"></span>Reflejado en frontera 2|3</label>
							<label class="legend-item"><input type="checkbox" data-k="tr23" checked><span class="swatch" style="background:#8778B3"></span>Transmitido 2&rarr;3</label>
							<label class="legend-item"><input type="checkbox" data-k="pot" checked><span class="swatch" style="background:#C56E1A"></span>Potencial</label>
							<label class="legend-item"><input type="checkbox" data-k="en" checked><span class="swatch" style="background:repeating-linear-gradient(90deg,#777 0 6px,transparent 6px 10px)"></span>Nivel de energía</label>
							<label class="legend-item"><input type="checkbox" data-k="tot"><span class="swatch" style="background:#222"></span>Re &psi;(x) total</label>
						</div>
					</div>
				</aside>

				<div class="plot-column">
					<div class="canvas-container">
						<canvas id="plot2" width="1000" height="540"></canvas>
					</div>
					<div class="info-panel">
						<div class="info-grid">
							<div class="info-box"><h4>&Delta;E = E &minus; V<sub>out</sub></h4><div class="info-value" id="i2_dE">0.00 eV</div></div>
							<div class="info-box"><h4>E &minus; V<sub>in</sub></h4><div class="info-value" id="i2_dEin">0.00 eV</div></div>
							<div class="info-box"><h4>k<sub>in</sub></h4><div class="info-value" id="i2_kin">0.000 &Aring;&#8315;&sup1;</div></div>
							<div class="info-box"><h4>k<sub>out</sub></h4><div class="info-value" id="i2_kout">0.000 &Aring;&#8315;&sup1;</div></div>
							<div class="info-box"><h4>&lambda;<sub>dB</sub> = 2&pi;/k<sub>out</sub></h4><div class="info-value" id="i2_ldb">0.00 &Aring;</div></div>
							<div class="info-box"><h4>&Lambda; = L / &lambda;<sub>dB</sub></h4><div class="info-value" id="i2_lam">0.00</div></div>
							<div class="info-box"><h4>R = |B&#8321;/A&#8321;|&sup2;</h4><div class="info-value" id="i2_R">0.000</div></div>
							<div class="info-box"><h4>T = |A&#8323;/A&#8321;|&sup2;</h4><div class="info-value" id="i2_T">0.000</div></div>
							<div class="info-box"><h4>R + T</h4><div class="info-value" id="i2_sum">1.000</div></div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<script>
	(function () {
		'use strict';

		var T = HTMLSim;
		var kOf = T.kOf, ensureSize = T.ensureSize, drawText = T.drawText, niceStep = T.niceStep, fmtTick = T.fmtTick, bindPair = T.bindPair, getNum = T.getNum, setPair = T.setPair;

		/* ============================================================
		   Números complejos [re, im] (k_in puede ser imaginario puro: eta < 1)
		   ============================================================ */
		function cm(a, b) { return [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]]; }
		function cd(a, b) { var d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; }
		function ca(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
		function cs(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
		function cab(a) { return Math.sqrt(a[0] * a[0] + a[1] * a[1]); }
		function ce(re, im) { var m = Math.exp(re); return [m * Math.cos(im), m * Math.sin(im)]; }   // e^{re + i im}

		/* Sistema lineal 4x4 complejo por eliminación gaussiana con pivoteo parcial */
		function solve4(M, b) {
			var n = 4, i, j, k, p, t, f, x = [];
			for (i = 0; i < n; i++) { M[i] = M[i].concat([b[i]]); }
			for (i = 0; i < n; i++) {
				p = i;
				for (k = i + 1; k < n; k++) { if (cab(M[k][i]) > cab(M[p][i])) { p = k; } }
				t = M[i]; M[i] = M[p]; M[p] = t;
				for (k = i + 1; k < n; k++) {
					f = cd(M[k][i], M[i][i]);
					for (j = i; j <= n; j++) { M[k][j] = cs(M[k][j], cm(f, M[i][j])); }
				}
			}
			for (i = n - 1; i >= 0; i--) {
				t = M[i][n];
				for (j = i + 1; j < n; j++) { t = cs(t, cm(M[i][j], x[j])); }
				x[i] = cd(t, M[i][i]);
			}
			return x;
		}

		/* ============================================================
		   Coeficientes de las ondas (con A1 = 1) para eta, L (Å), dV (eV).
		   Región 1:  e^{ikx} + B1 e^{-ikx}                (k = k_out)
		   Región 2:  a u(x) + b v(x),  u = e^{iq(x+L/2)},  v = e^{-iq(x-L/2)}   (q = k_in)
		              (A2 = a e^{iqL/2}, B2 = b e^{iqL/2}; con a y b ninguna exponencial desborda)
		   Región 3:  A3 e^{ikx}
		   Empalme de psi y psi' en x = -L/2 y x = +L/2.
		   ============================================================ */
		function coefficients(eta, L, dV) {
			if (Math.abs(eta - 1) < 1e-4) { eta = 1 + 1e-4; }      // en eta = 1 exacto k_in = 0 y las dos exponenciales coinciden (sistema singular)
			var k = kOf(eta * dV);                         // k_out  (E - V_out = eta dV)
			var qr = 0, qi = 0;
			if (eta > 1) { qr = kOf((eta - 1) * dV); }     // k_in real
			else if (eta < 1) { qi = kOf((1 - eta) * dV); }// k_in = i gamma_in
			var q = [qr, qi];
			var p = ce(0, k * L / 2), pc = ce(0, -k * L / 2);     // e^{+ikL/2}, e^{-ikL/2}
			var iq = [-qi, qr];                                    // i q
			var P = ce(iq[0] * L, iq[1] * L);                      // e^{iqL}
			var one = [1, 0], zero = [0, 0], mk = [-k, 0];
			var M = [
				[p, [-1, 0], cs(zero, P), zero],                  // (1)  B1 p - a - b P = -p*
				[cm(mk, p), cs(zero, q), cm(q, P), zero],          // (2) -k p B1 - q a + q P b = -k p*
				[zero, P, one, cs(zero, p)],                      // (3)  P a + b - p A3 = 0
				[zero, cm(q, P), cs(zero, q), cm(mk, p)]           // (4)  q P a - q b - k p A3 = 0
			];
			var rhs = [cs(zero, pc), [-k * pc[0], -k * pc[1]], zero, zero];   // (-p*, -k p*, 0, 0)
			var sol = solve4(M, rhs);
			return { k: k, q: q, B1: sol[0], a: sol[1], b: sol[2], A3: sol[3] };
		}

		var P2 = {
			cv: document.getElementById('plot2'),
			eta: document.getElementById('eta2'), etaR: document.getElementById('eta2r'),
			L: document.getElementById('L2'), LR: document.getElementById('L2r'),
			dV: document.getElementById('dV2'), dVR: document.getElementById('dV2r'),
			show: { inc: true, ref12: true, tr12: true, ref23: true, tr23: true, pot: true, en: true, tot: false },
			Lmax: 30, dVmax: 20, etaMax: 3,
			sfactor: 1.10   // margen vertical sobre max(E, V_in): fija cuánto "sube" la onda dibujada (en el notebook: 1.05)
		};
		var S2 = { ctx: null, w: 0, h: 0 };
		ensureSize(S2, P2.cv, 0.56, 400, 600);
		// Colores de la paleta usada en Mathematica (ColorData[97])
		var COL = { inc: '#5E81B5', ref12: '#E19C24', tr12: '#8FB032', ref23: '#EB6235', tr23: '#8778B3', pot: '#C56E1A' };
		// paso de muestreo: 16 puntos por la longitud de onda más corta posible (la de afuera, k_out máximo)
		var DX = 2 * Math.PI / (16 * kOf(P2.etaMax * P2.dVmax));

		function linspace(a, b, n) {
			var arr = [], i;
			for (i = 0; i <= n; i++) { arr.push(a + (b - a) * i / n); }
			return arr;
		}

		function drawPlot2() {
			var eta = getNum(P2.eta, 1.505), L = getNum(P2.L, 15.5), dV = getNum(P2.dV, 10.5);
			ensureSize(S2, P2.cv, 0.56, 400, 600);
			var ctx = S2.ctx, W = S2.w, H = S2.h;
			var fs = Math.max(0.62, Math.min(1, W / 760));
			var ml = 78, mr = 28, mt = 94, mb = 62;
			var pw = W - ml - mr, ph = H - mt - mb;
			var xMax = (P2.Lmax + 5 * L) / 6;                          // la ventana crece con L (como en el notebook)
			var xmin = -xMax, xmax = xMax;
			var top = Math.max(eta * dV, dV);                          // el más alto entre la energía y la cima
			var ymin = -0.01 * P2.dVmax, ymax = P2.sfactor * top;
			function X(v) { return ml + (v - xmin) / (xmax - xmin) * pw; }
			function Y(v) { return mt + ph - (v - ymin) / (ymax - ymin) * ph; }

			var cf = coefficients(eta, L, dV);
			var h0 = eta * dV;
			var R = cab(cf.B1) * cab(cf.B1), T = cab(cf.A3) * cab(cf.A3);
			var lamdB = 2 * Math.PI / cf.k;                            // longitud de onda de afuera (definición de la teoría)
			// amplitud dibujada: que la onda más grande quepa en el margen sobre "top"
			var maxC = Math.min(3, Math.max(1, cab(cf.B1), cab(cf.a), cab(cf.b), cab(cf.A3)));   // tope 3: cerca de eta = 1 a y b crecen (se compensan entre sí)
			var amp = (P2.sfactor - 1) * top / maxC;

			ctx.clearRect(0, 0, W, H);
			ctx.fillStyle = '#fff';
			ctx.fillRect(ml, mt, pw, ph);

			// rejilla
			var v, stepX = niceStep(2 * xMax, 7), stepY = niceStep(ymax - ymin, 8);
			ctx.lineWidth = 1; ctx.strokeStyle = '#ececf1';
			for (v = Math.ceil(xmin / stepX) * stepX; v <= xmax + 1e-9; v += stepX) {
				ctx.beginPath(); ctx.moveTo(X(v), mt); ctx.lineTo(X(v), mt + ph); ctx.stroke();
				drawText(ctx, fmtTick(v), X(v), mt + ph + 22, 17, 'center', '#555');
			}
			for (v = Math.ceil(ymin / stepY) * stepY; v <= ymax + 1e-9; v += stepY) {
				ctx.beginPath(); ctx.moveTo(ml, Y(v)); ctx.lineTo(ml + pw, Y(v)); ctx.stroke();
				drawText(ctx, fmtTick(v), ml - 10, Y(v) + 5, 17, 'right', '#555');
			}

			// fronteras de la barrera (±L/2)
			ctx.setLineDash([5, 5]); ctx.strokeStyle = '#999'; ctx.lineWidth = 1.2;
			ctx.beginPath();
			ctx.moveTo(X(-L / 2), mt); ctx.lineTo(X(-L / 2), mt + ph);
			ctx.moveTo(X(L / 2), mt); ctx.lineTo(X(L / 2), mt + ph);
			ctx.stroke(); ctx.setLineDash([]);

			ctx.strokeStyle = '#333'; ctx.lineWidth = 1.6;
			ctx.strokeRect(ml, mt, pw, ph);

			ctx.save();
			ctx.beginPath(); ctx.rect(ml, mt, pw, ph); ctx.clip();

			// nivel de energía
			if (P2.show.en) {
				ctx.setLineDash([9, 6]); ctx.strokeStyle = '#777'; ctx.lineWidth = 1.4;
				ctx.beginPath(); ctx.moveTo(ml, Y(h0)); ctx.lineTo(ml + pw, Y(h0)); ctx.stroke();
				ctx.setLineDash([]);
			}

			// funciones base de cada componente (complejas) y dibujo de su parte real
			var fInc  = function (x) { return ce(0, cf.k * x); };
			var fRef1 = function (x) { return cm(cf.B1, ce(0, -cf.k * x)); };
			var fTr12 = function (x) { var s = x + L / 2; return cm(cf.a, ce(-cf.q[1] * s, cf.q[0] * s)); };          // a e^{iq(x+L/2)}
			var fRef2 = function (x) { var s = x - L / 2; return cm(cf.b, ce(cf.q[1] * s, -cf.q[0] * s)); };         // b e^{-iq(x-L/2)}
			var fTr23 = function (x) { return cm(cf.A3, ce(0, cf.k * x)); };

			function wave(xs, f, color, lw) {
				ctx.strokeStyle = color; ctx.lineWidth = lw || 2.2; ctx.lineJoin = 'round';
				ctx.beginPath();
				for (var n = 0; n < xs.length; n++) {
					var px = X(xs[n]), py = Y(h0 + amp * f(xs[n])[0]);
					if (n === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
				}
				ctx.stroke();
			}

			var n1 = Math.max(2, Math.ceil((xMax - L / 2) / DX));
			var n2 = Math.max(2, Math.ceil(L / DX));
			var x1 = linspace(-xMax, -L / 2, n1);
			var x2 = linspace(-L / 2, L / 2, n2);
			var x3 = linspace(L / 2, xMax, n1);

			if (P2.show.inc)   { wave(x1, fInc, COL.inc); }
			if (P2.show.ref12) { wave(x1, fRef1, COL.ref12); }
			if (P2.show.tr12)  { wave(x2, fTr12, COL.tr12); }
			if (P2.show.ref23) { wave(x2, fRef2, COL.ref23); }
			if (P2.show.tr23)  { wave(x3, fTr23, COL.tr23); }

			// Re ψ total: suma de las componentes en cada región
			if (P2.show.tot) {
				var tot = [
					[x1, function (x) { return fInc(x)[0] + fRef1(x)[0]; }],
					[x2, function (x) { return fTr12(x)[0] + fRef2(x)[0]; }],
					[x3, function (x) { return fTr23(x)[0]; }]
				];
				ctx.strokeStyle = '#222'; ctx.lineWidth = 2.8; ctx.lineJoin = 'round';
				tot.forEach(function (rg) {
					ctx.beginPath();
					rg[0].forEach(function (x, idx) {
						var px = X(x), py = Y(h0 + amp * rg[1](x));
						if (idx === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
					});
					ctx.stroke();
				});
			}

			// potencial (V_out = 0 afuera, V_in = ΔV adentro)
			if (P2.show.pot) {
				ctx.strokeStyle = COL.pot; ctx.lineWidth = 3.4; ctx.lineJoin = 'miter';
				ctx.beginPath();
				ctx.moveTo(X(-xMax), Y(0)); ctx.lineTo(X(-L / 2), Y(0)); ctx.lineTo(X(-L / 2), Y(dV));
				ctx.lineTo(X(L / 2), Y(dV)); ctx.lineTo(X(L / 2), Y(0)); ctx.lineTo(X(xMax), Y(0));
				ctx.stroke();
			}
			ctx.restore();

			// etiquetas de regiones (justo encima del marco, para no tapar las ondas)
			drawText(ctx, '1', (X(-xMax) + X(-L / 2)) / 2, mt - 8, 22, 'center', '#888', 'bold');
			drawText(ctx, '2', X(0), mt - 8, 22, 'center', '#888', 'bold');
			drawText(ctx, '3', (X(L / 2) + X(xMax)) / 2, mt - 8, 22, 'center', '#888', 'bold');

			// etiquetas de ejes
			drawText(ctx, 'x (Å)', ml + pw / 2, H - 14, 22, 'center', '#333', 'bold');
			ctx.save();
			ctx.translate(20, mt + ph / 2); ctx.rotate(-Math.PI / 2);
			drawText(ctx, 'V(x) en eV, ψ(x) ', 0, 0, 22, 'center', '#333', 'bold');
			ctx.restore();

			// título (dos líneas)
			var r3 = function (a) { return (Math.round(a * 1000) / 1000); };
			drawText(ctx, 'ΔE = ' + r3(eta) + ' ΔV,   ΔV = ' + r3(dV) + ' eV,   L = ' + r3(L) + ' Å  (o Λ = ' + (L / lamdB).toFixed(2) + ')',
					 W / 2, 34, Math.round(22 * fs), 'center', '#333', 'bold');
			drawText(ctx, 'R = ' + R.toFixed(3) + ',   T = ' + (T < 1e-3 && T > 0 ? T.toExponential(2) : T.toFixed(3)), W / 2, 62, Math.round(22 * fs), 'center', '#555', 'bold');

			// información
			document.getElementById('i2_dE').textContent = h0.toFixed(2) + ' eV';
			document.getElementById('i2_dEin').textContent = ((eta - 1) * dV).toFixed(2) + ' eV';
			document.getElementById('i2_kin').textContent = (cf.q[1] > 0 ? 'i·' + cf.q[1].toFixed(3) : cf.q[0].toFixed(3)) + ' Å⁻¹';
			document.getElementById('i2_kout').textContent = cf.k.toFixed(3) + ' Å⁻¹';
			document.getElementById('i2_ldb').textContent = lamdB.toFixed(2) + ' Å';
			document.getElementById('i2_lam').textContent = (L / lamdB).toFixed(3);
			document.getElementById('i2_R').textContent = R.toFixed(4);
			document.getElementById('i2_T').textContent = (T < 1e-3 && T > 0) ? T.toExponential(2) : T.toFixed(4);
			document.getElementById('i2_sum').textContent = (R + T).toFixed(4);
		}

		bindPair(P2.eta, P2.etaR, drawPlot2);
		bindPair(P2.L, P2.LR, drawPlot2);
		bindPair(P2.dV, P2.dVR, drawPlot2);
		Array.prototype.forEach.call(document.querySelectorAll('#legend2 input[type="checkbox"]'), function (cb) {
			cb.addEventListener('change', function () { P2.show[cb.getAttribute('data-k')] = cb.checked; drawPlot2(); });
		});
		document.getElementById('reset2').addEventListener('click', function () {
			setPair(P2.eta, P2.etaR, 1.505);
			setPair(P2.L, P2.LR, 15.5);
			setPair(P2.dV, P2.dVR, 10.5);
			drawPlot2();
		});

		/* Arranque */
		drawPlot2();
		window.addEventListener('resize', drawPlot2);

		T.onFontsReady(drawPlot2);
		window.__coefB = coefficients;   // solo para pruebas
	})();
	</script>
</body>
</html>
